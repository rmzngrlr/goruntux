<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; width:264px; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#0e141f; color:#e7e9ea; padding:14px; }
  button { width:100%; border:0; border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:10px; margin-top:9px; transition:background .15s, transform .05s; color:#fff; text-align:left; }
  button:first-of-type { margin-top:0; }
  button:active { transform:translateY(1px); }
  .gx-mavi { background:#1d9bf0; }
  .gx-mavi:hover { background:#1a8cd8; }
  .gx-yesil { background:#00ba7c; }
  .gx-yesil:hover { background:#00a36d; }
  button svg, button img { flex:0 0 auto; }
  .gx-ytxt { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .gx-ybas { font-weight:700; font-size:13.5px; }
  .gx-yalt { font-weight:500; font-size:11px; line-height:1.3; color:rgba(255,255,255,0.88); }
</style>
</head>
<body>
  <button class="gx-mavi" id="gx-panel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9V4.5h4.5"/><path d="M15 4.5h4.5v4.5"/><path d="M19.5 15v4.5h-4.5"/><path d="M9 19.5H4.5v-4.5"/><path d="M9.6 9.6l4.8 4.8"/><path d="M14.4 9.6l-4.8 4.8"/></svg>
    GörüntüX'e Git
  </button>
  <button class="gx-yesil" id="gx-yakala">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9V4.5h4.5"/><path d="M15 4.5h4.5v4.5"/><path d="M19.5 15v4.5h-4.5"/><path d="M9 19.5H4.5v-4.5"/><path d="M12 8.5v7"/><path d="M8.5 12h7"/></svg>
    <span class="gx-ytxt">
      <span class="gx-ybas">Ekran Görüntüsü Al</span>
      <span class="gx-yalt">Bu sayfanın ekran görüntüsünü alıp kırparak rapora ekleyin.</span>
    </span>
  </button>
  <script src="popup.js"></script>
</body>
</html>
