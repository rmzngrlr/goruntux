version: '3.8'

services:
  goruntux:
    build: .
    container_name: goruntux_sunucu
    # [IP KAPATILDI] Host port eşlemesi (3011:3011) KALDIRILDI -> 188.166.126.244:3011 dışarıdan açılmaz.
    # Uygulama konteyner içinde 0.0.0.0:3011'de dinler; cloudflared iç ağdan goruntux:3011'e erişir (tünel çalışır).
    # Sunucuda yerel hata ayıklama gerekirse geçici: ports: ["127.0.0.1:3011:3011"].
    restart: always

  # Cloudflare Tunnel: https://goruntux.rgmedya.tr -> goruntux:3011 (aynı compose ağı).
  # Token .env'de CF_TUNNEL_TOKEN olarak tutulur (gizli, commit edilmez). Hesabını Bil ile aynı yöntem.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: goruntux_tunnel
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - goruntux
